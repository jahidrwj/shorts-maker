name: Make Video

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Unique row id"
        required: true
      title:
        description: "Video title"
        required: true
      script:
        description: "Voiceover script (Bangla)"
        required: true
      keywords:
        description: "English stock-video keywords, comma separated"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          pip install edge-tts requests

      - name: Make video
        env:
          TITLE: ${{ inputs.title }}
          SCRIPT: ${{ inputs.script }}
          KEYWORDS: ${{ inputs.keywords }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python make_video.py

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.id }}
        run: |
          TAG="video-${ID}"
          gh release create "$TAG" out.mp4 --title "$TAG" --notes "auto"
          echo "VIDEO_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/out.mp4" >> "$GITHUB_ENV"

      - name: Notify n8n
        env:
          WEBHOOK: ${{ secrets.N8N_WEBHOOK_URL }}
          ID: ${{ inputs.id }}
        run: |
          jq -n --arg id "$ID" --arg url "$VIDEO_URL" '{id:$id, video_url:$url}' \
            | curl -sS -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"

      - name: Delete releases older than 14 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '.[] | select(.createdAt < (now - 1209600 | todate)) | .tagName' \
            | xargs -r -I{} gh release delete {} --cleanup-tag -y
